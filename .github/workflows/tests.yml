name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Ruff & pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Home Assistant 2026.10 (pinned through the test package) needs Python 3.14
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements_test.txt
      - name: Install dependencies
        run: python -m pip install --upgrade pip ruff -r requirements_test.txt
      - name: Ruff
        run: ruff check . && ruff format --check .
      - name: Pytest
        run: python -m pytest -q
